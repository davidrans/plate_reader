<!doctype html>
<!--
  Dev harness: runs the real alpr.js pipeline against the checked-in test
  images, so the JS port can be checked against scripts/verify_models.py's
  Python output without needing a camera or a phone.

  Served at /static/../tests/harness.html only in local dev — see README.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ALPR harness</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort.webgpu.min.js"></script>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 1.5rem; }
    pre { background: #f4f4f5; padding: 1rem; border-radius: 6px; white-space: pre-wrap; }
    img { max-width: 320px; border: 1px solid #ccc; margin-right: 1rem; vertical-align: top; }
  </style>
</head>
<body>
  <h1>ALPR pipeline harness</h1>
  <div id="images"></div>
  <pre id="out">running...</pre>

  <script type="module">
    import { DEFAULTS, activeBackend, isPlausible, loadModels, readPlates } from "/static/alpr.js";
    import { PlateTracker, confusionDistance, iou } from "/static/tracker.js";
    import { RecentPlates, normalizeStored } from "/static/recent.js";

    const CASES = [
      { file: "/tests/assets/zaz.jpg", expect: "AE6133CT", region: "Ukraine" },
      { file: "/tests/assets/sgp.jpg", expect: "SDN7484U", region: "Singapore" },
    ];

    const out = document.getElementById("out");
    const log = (m) => (out.textContent += m + "\n");

    // createImageBitmap rather than <img>.decode(): Chrome defers image
    // decoding in tabs that aren't foreground, which makes decode() hang
    // indefinitely under automation. ImageBitmap skips the render pipeline
    // and is a valid drawImage source, which is all alpr.js needs.
    async function loadImage(src) {
      const blob = await fetch(src).then((r) => r.blob());
      const bmp = await createImageBitmap(blob);
      const canvas = document.createElement("canvas");
      canvas.width = bmp.width;
      canvas.height = bmp.height;
      canvas.getContext("2d").drawImage(bmp, 0, 0);
      document.getElementById("images").append(canvas);
      return bmp;
    }

    // --- tracker unit tests (deterministic, no models or camera needed) -----
    //
    // These simulate frames rather than running inference, so timestamps are
    // injected and the results are exact. They cover the bug this was written
    // for: one plate producing many rows because a misread broke the dedupe.

    let checks = 0;
    let failures = 0;

    function check(name, condition, detail = "") {
      checks++;
      if (!condition) failures++;
      log(`  ${condition ? "PASS" : "FAIL"} ${name}${detail ? ` — ${detail}` : ""}`);
    }

    const boxAt = (x, y, w = 100, h = 40) => ({ x1: x, y1: y, x2: x + w, y2: y + h });
    const read = (text, confidence, box, crop = null) => ({ text, confidence, box, region: null, crop });
    // Stand-in for a crop canvas — the tracker only stores and hands it back.
    const fakeCrop = (id) => ({ id });

    function runTrackerTests() {
      log("--- tracker unit tests ---");

      // Confusable substitutions must be cheaper than genuine differences,
      // otherwise "ABCI23" wouldn't merge into "ABC123" any more readily than
      // a real neighbouring plate would.
      const confusable = confusionDistance("ABC123", "ABCI23");
      const genuine = confusionDistance("ABC123", "ABD123");
      check("confusable < genuine difference", confusable < genuine, `${confusable} vs ${genuine}`);
      check("identical strings distance 0", confusionDistance("ABC123", "ABC123") === 0);
      check("iou of identical boxes is 1", iou(boxAt(0, 0), boxAt(0, 0)) === 1);
      check("iou of disjoint boxes is 0", iou(boxAt(0, 0), boxAt(500, 500)) === 0);

      // The original bug: 14 good reads and one misread of the SAME plate.
      // Must yield one track whose leader is the majority reading.
      {
        const tracker = new PlateTracker();
        let t = 0;
        let last;
        for (let i = 0; i < 15; i++) {
          const r = i === 7 ? read("ABCI23", 0.55, boxAt(10, 10)) : read("ABC123", 0.95, boxAt(10, 10));
          last = tracker.update([r], (t += 100));
        }
        check("misread does not spawn a second track", last.live.length === 1, `${last.live.length} tracks`);
        check("majority reading wins the vote", last.live[0].text === "ABC123", last.live[0].text);
        check("track is confirmed", last.confirmed.length === 1);
      }

      // Below minVotes a track must stay unconfirmed, so a single spurious
      // frame never reaches the list.
      {
        const tracker = new PlateTracker();
        const r = tracker.update([read("ZZ9999", 0.9, boxAt(10, 10))], 1000);
        check("single frame is not yet confirmed", r.confirmed.length === 0);
        check("but it is tracked", r.live.length === 1);
      }

      // Two plates on screen at once must stay independent — multi-plate
      // scenes are supported and each gets its own vote tally.
      {
        const tracker = new PlateTracker();
        let t = 0;
        let last;
        for (let i = 0; i < 4; i++) {
          last = tracker.update(
            [read("ABC123", 0.95, boxAt(10, 10)), read("XYZ789", 0.95, boxAt(400, 300))],
            (t += 100),
          );
        }
        check("two plates -> two tracks", last.live.length === 2, `${last.live.length}`);
        check("both confirmed", last.confirmed.length === 2);
        const texts = last.live.map((l) => l.text).sort();
        check("both texts kept distinct", texts.join(",") === "ABC123,XYZ789", texts.join(","));
      }

      // Same text in two clearly separate places = two different cars. Box
      // overlap has to keep them apart even though the text matches.
      {
        const tracker = new PlateTracker();
        const r = tracker.update(
          [read("ABC123", 0.95, boxAt(10, 10)), read("ABC123", 0.95, boxAt(600, 400))],
          1000,
        );
        check("identical text at two positions -> two tracks", r.live.length === 2, `${r.live.length}`);
      }

      // A track must expire once its plate leaves view, so the next sighting
      // is counted separately rather than continuing the old vote.
      {
        const tracker = new PlateTracker();
        tracker.update([read("ABC123", 0.95, boxAt(10, 10))], 1000);
        const gone = tracker.update([], 1000 + 1500);
        check("track expires after timeout", gone.live.length === 0 && gone.expired.length === 1);
      }

      // Fast camera motion breaks box overlap; the text match must still hold
      // the track together (this is why identity is "overlap OR text").
      {
        const tracker = new PlateTracker();
        let t = 0;
        let last;
        for (let i = 0; i < 4; i++) {
          last = tracker.update([read("ABC123", 0.95, boxAt(i * 300, i * 200))], (t += 100));
        }
        check("text match survives lost box overlap", last.live.length === 1, `${last.live.length}`);
      }

      // The stored photo should be the clearest view of the plate, not merely
      // the most recent frame — that's what makes the state readable.
      {
        const tracker = new PlateTracker();
        tracker.update([read("ABC123", 0.70, boxAt(10, 10), fakeCrop("blurry"))], 100);
        tracker.update([read("ABC123", 0.98, boxAt(10, 10), fakeCrop("sharp"))], 200);
        tracker.update([read("ABC123", 0.75, boxAt(10, 10), fakeCrop("later-blurry"))], 300);
        const track = tracker.tracks[0];
        check("keeps highest-confidence crop", track.bestCrop?.id === "sharp", track.bestCrop?.id);

        const taken = track.takeCropIfChanged();
        check("crop handed over once", taken?.crop.id === "sharp");
        check("crop carries its confidence", taken?.confidence === 0.98, `${taken?.confidence}`);
        check("not handed over again unchanged", track.takeCropIfChanged() === null);

        tracker.update([read("ABC123", 0.99, boxAt(10, 10), fakeCrop("sharpest"))], 400);
        check("re-offered after improving", track.takeCropIfChanged()?.crop.id === "sharpest");
      }

      log(`--- tracker: ${checks - failures}/${checks} checks passed ---\n`);
    }

    // --- recent-list tests -------------------------------------------------
    //
    // End-to-end over tracker + list: this is the combination the original bug
    // lived in, so the cases mirror the reported symptom directly.

    function feed(tracker, list, reads, { frames = 5, start = 1000, step = 100 } = {}) {
      let t = start;
      for (let i = 0; i < frames; i++) {
        const { confirmed } = tracker.update(reads(i), (t += step));
        for (const c of confirmed) list.upsert(c, t);
      }
      return t;
    }

    function runRecentTests() {
      log("--- recent list tests ---");

      // The reported bug: one plate held in frame, occasionally misread,
      // producing a pile of near-duplicate rows. Must be exactly one row.
      {
        const tracker = new PlateTracker();
        const list = new RecentPlates();
        feed(tracker, list, (i) => [
          i === 6 ? read("ABCI23", 0.62, boxAt(10, 10)) : read("ABC123", 0.95, boxAt(10, 10)),
        ], { frames: 15 });
        check("one plate -> one row", list.entries.length === 1, `${list.entries.length} rows`);
        check("row holds the voted text", list.entries[0]?.text === "ABC123", list.entries[0]?.text);
        check("counted as a single sighting", list.entries[0]?.count === 1, `count=${list.entries[0]?.count}`);
      }

      // Leaving and returning is a genuinely new sighting: still one row, but
      // the count goes up.
      {
        const tracker = new PlateTracker();
        const list = new RecentPlates();
        const reads = () => [read("ABC123", 0.95, boxAt(10, 10))];
        let t = feed(tracker, list, reads, { frames: 5, start: 1000 });
        tracker.update([], t + 2000); // plate leaves view -> track expires
        feed(tracker, list, reads, { frames: 5, start: t + 3000 });
        check("re-sighting keeps one row", list.entries.length === 1, `${list.entries.length} rows`);
        check("re-sighting bumps the count", list.entries[0]?.count === 2, `count=${list.entries[0]?.count}`);
      }

      // Two cars in frame at once must produce two independent rows.
      {
        const tracker = new PlateTracker();
        const list = new RecentPlates();
        feed(tracker, list, () => [
          read("ABC123", 0.95, boxAt(10, 10)),
          read("XYZ789", 0.95, boxAt(400, 300)),
        ]);
        check("two plates -> two rows", list.entries.length === 2, `${list.entries.length} rows`);
        check("each counted once", list.entries.every((e) => e.count === 1));
      }

      // A separate later track settling on a confusable variant should merge
      // into the existing row rather than adding a near-duplicate.
      {
        const list = new RecentPlates();
        const trackA = { entryText: null };
        const trackB = { entryText: null };
        list.upsert({ track: trackA, text: "ABC123", confidence: 0.95, region: null }, 1000);
        list.upsert({ track: trackB, text: "ABCI23", confidence: 0.9, region: null }, 5000);
        check("confusable variant merges into existing row", list.entries.length === 1, `${list.entries.length} rows`);
        check("established spelling is kept", list.entries[0]?.text === "ABC123", list.entries[0]?.text);
      }

      // ...but a genuinely different plate must not be merged away.
      {
        const list = new RecentPlates();
        list.upsert({ track: { entryText: null }, text: "ABC123", confidence: 0.95, region: null }, 1000);
        list.upsert({ track: { entryText: null }, text: "ABD123", confidence: 0.95, region: null }, 5000);
        check("genuinely different plate stays separate", list.entries.length === 2, `${list.entries.length} rows`);
      }

      // The region filter treats a non-US classification as a misread signal.
      {
        const us = { name: "United States", confidence: 0.9 };
        const br = { name: "Brazil", confidence: 0.9 };
        check("US plate accepted", isPlausible("ABC123", 0.9, us, DEFAULTS));
        check("non-US read rejected as misread", !isPlausible("ABC123", 0.9, br, DEFAULTS));
        check(
          "filter off accepts any region",
          isPlausible("ABC123", 0.9, br, { ...DEFAULTS, allowedRegions: null }),
        );
        check("short text still rejected", !isPlausible("AB", 0.9, us, DEFAULTS));
        check("low confidence still rejected", !isPlausible("ABC123", 0.2, us, DEFAULTS));
      }

      // "United States" must not be shown as a row label: it's a country, not
      // a state, and with the filter on it's true of every row.
      {
        const list = new RecentPlates();
        const e = list.upsert(
          { track: { entryText: null }, text: "ABC123", confidence: 0.9,
            region: { name: "United States", confidence: 0.9 } },
          1000,
        );
        check("uninformative region is not stored on the row", e.region === "", `"${e.region}"`);
      }

      // The row must keep the best photo of a plate ever seen, across separate
      // sightings — a track's own quality bar resets, the row's must not.
      {
        const list = new RecentPlates();
        const track = { entryText: null };
        const base = { track, text: "ABC123", confidence: 0.9, region: null };
        list.upsert({ ...base, image: "img:OK", imageConfidence: 0.80 }, 1000);
        check("photo stored on the row", list.entries[0].image === "img:OK");

        list.upsert({ ...base, image: null }, 1100);
        check("no photo offered does not clear it", list.entries[0].image === "img:OK");

        list.upsert({ ...base, image: "img:BETTER", imageConfidence: 0.97 }, 1200);
        check("higher-quality photo replaces it", list.entries[0].image === "img:BETTER");

        // A separate, later sighting that happened to be blurrier.
        list.upsert(
          { ...base, track: { entryText: null }, image: "img:WORSE", imageConfidence: 0.55 },
          9000,
        );
        check("blurrier later sighting does not replace it", list.entries[0].image === "img:BETTER");
        check("stored quality is tracked", list.entries[0].imageConfidence === 0.97);
      }

      // Rows saved before sighting counts existed must survive the upgrade.
      {
        const migrated = normalizeStored([{ text: "OLD999", confidence: 0.9, region: "", ts: 42 }]);
        check("legacy row migrates", migrated[0].count === 1 && migrated[0].lastSeen === 42);
        check("normalizeStored tolerates junk", normalizeStored(null).length === 0);
      }

      log(`--- recent: ${checks - failures}/${checks} cumulative checks passed ---\n`);
    }

    out.textContent = "";
    runTrackerTests();
    runRecentTests();

    try {
      const backend = await loadModels((m) => log(m));
      log(`backend: ${backend} (activeBackend=${activeBackend()})\n`);

      let pass = 0;
      for (const c of CASES) {
        const img = await loadImage(c.file);
        const t0 = performance.now();
        // allowedRegions off: these reference plates are Ukrainian and
        // Singaporean, so the app's US-only default would reject them.
        const results = await readPlates(img, { ...DEFAULTS, allowedRegions: null });
        const ms = (performance.now() - t0).toFixed(0);

        log(`${c.file}  (${img.width}x${img.height})  ${ms} ms`);
        if (!results.length) {
          log(`  FAIL: no plate detected (expected ${c.expect})\n`);
          continue;
        }
        for (const r of results) {
          const ok = r.text === c.expect;
          if (ok) pass++;
          log(
            `  ${ok ? "PASS" : "FAIL"} text=${r.text} (expected ${c.expect}) ` +
              `det=${r.detScore.toFixed(3)} ocr=${r.confidence.toFixed(3)} ` +
              `region=${r.region?.name} (expected ${c.region})`,
          );
        }
        log("");
      }
      log(`=== images: ${pass}/${CASES.length} matched the Python reference ===`);
      log(`=== unit checks: ${checks - failures}/${checks} passed ===`);
    } catch (err) {
      log(`ERROR: ${err.stack || err}`);
    }
  </script>
</body>
</html>
