[project]
name = "plate-reader"
version = "0.1.0"
description = "Client-side ALPR PWA — plate detection and OCR run in the browser via ONNX Runtime Web"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
]

# Dev-only. Used by scripts/verify_models.py to re-check the ONNX I/O
# contract that app/static/alpr.js reimplements in JS. The app itself never
# loads a model server-side — all inference happens in the browser.
[dependency-groups]
dev = [
    "numpy>=2",
    "onnxruntime>=1.20",
    "pillow>=11",
]

[tool.ruff]
line-length = 100
